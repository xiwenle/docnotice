# 工程 lint / 类型检查配置固化（2026-10-25）
# 来源：docs/CODE_REVIEW_2026-10-16.md 问题 M2（配置随人走）/ M3（解释器不一致）。
# 约定：
# - 目标运行时 Python 3.10+（2026-10-25 依赖安全升级后由 3.9 抬升，fastapi 0.133 /
#   starlette 1.3 等 Requires-Python >=3.10 实测）；ruff / mypy target 均按 3.10 固化；
#   开发机解释器为 3.13（见 docs/TESTING.md §七）。
# - 宽捕获（BLE001）按既有纪律：允许但必须 `# noqa: BLE001` + 理由注释。
# - 规则集只固化现有实践（默认 E4/E7/E9/F + BLE），不引入新门槛。

[tool.ruff]
target-version = "py310"
line-length = 110
include = ["app/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.mypy]
# mypy ≥2.4 不再支持 python_version 3.9，且依赖集已要求 3.10+，两者取齐按 3.10。
python_version = "3.10"
files = ["app"]
ignore_missing_imports = true
# 基线策略：先固化解释器与入口（M3），不开启严格模式；
# 2026-10-25 全仓 app/ 零错误实测，此后新代码不应引入新错误。

[tool.pytest.ini_options]
# 默认并行跑（2026-10-26 接入 pytest-xdist）：
# 2026-11-08 Windows / Python 3.13.7：645 用例 28.43s 全绿。
# 隔离原理：conftest.py 顶部用 mkdtemp 建【会话级】临时目录；xdist 每个 worker
# 是独立进程，各自 import conftest → 各自 mkdtemp → 各自独立 app.db，
# 因此各 worker 的 setup_db(drop_all/create_all) 互不干扰。
# 需要串行定位问题时：pytest -p no:xdist 或 pytest -n 0
addopts = "-n auto"
testpaths = ["tests"]

