{% extends "base.html" %}
{% block title %}修改密码 - {{ app_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 560px; margin: 40px auto;">
  <h1 style="font-size: 20px; margin-bottom: 8px;">修改密码</h1>
  {% if current_user.must_change_password %}
  <div class="alert alert-warning" id="cp-must-banner">
    <span>当前为初始/重置密码，首次使用前必须修改。</span>
  </div>
  {% endif %}
  <form id="cp-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="cp-old">当前密码</label>
      <div class="password-field">
        <input class="form-control" type="password" id="cp-old" autocomplete="current-password" required>
        <button type="button" class="password-toggle" data-password-toggle="cp-old"
                aria-label="显示密码" aria-pressed="false">显示</button>
      </div>
      <p class="form-error">请输入当前密码</p>
    </div>
    <div class="form-group">
      <label class="form-label" for="cp-new">新密码</label>
      <div class="password-field">
        <input class="form-control" type="password" id="cp-new" autocomplete="new-password" required>
        <button type="button" class="password-toggle" data-password-toggle="cp-new"
                aria-label="显示密码" aria-pressed="false">显示</button>
      </div>
      <p class="form-error">至少 8 位，需包含字母和数字</p>
    </div>
    <div class="form-group">
      <label class="form-label" for="cp-confirm">确认新密码</label>
      <div class="password-field">
        <input class="form-control" type="password" id="cp-confirm" autocomplete="new-password" required>
        <button type="button" class="password-toggle" data-password-toggle="cp-confirm"
                aria-label="显示密码" aria-pressed="false">显示</button>
      </div>
      <p class="form-error">两次输入的新密码不一致</p>
    </div>
    <div id="cp-error" class="alert alert-danger hidden"><span id="cp-error-text"></span></div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" id="cp-submit">保存新密码</button>
      <a class="btn btn-secondary" href="/">返回</a>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">window.__MUST_CHANGE_PASSWORD = {{ 'true' if current_user.must_change_password else 'false' }};</script>
<script src="/static/js/change_password.js"></script>
{% endblock %}
