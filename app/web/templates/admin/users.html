{% extends "base.html" %}
{% block title %}用户管理 - {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>用户管理</h1>
  <button class="btn btn-primary" id="btn-new-user">＋ 新建用户</button>
</div>

<div class="toolbar">
  <div class="form-group" style="flex:2;min-width:200px;">
    <label class="form-label" for="f-keyword">关键词</label>
    <input class="form-control" type="text" id="f-keyword" placeholder="用户名 / 姓名">
  </div>
  <div class="form-group">
    <label class="form-label" for="f-role">角色</label>
    <select class="form-control" id="f-role">
      <option value="">全部</option>
      <option value="user">普通用户</option>
      <option value="admin">管理员</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label" for="f-active">状态</label>
    <select class="form-control" id="f-active">
      <option value="" selected>全部</option>
      <option value="1">启用</option>
      <option value="0">停用</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label" for="f-department">部门</label>
    <select class="form-control" id="f-department"></select>
  </div>
  <div class="flex gap-2" style="padding-bottom:2px;">
    <button class="btn btn-primary" id="btn-search">查询</button>
    <button class="btn btn-ghost" id="btn-reset">重置</button>
  </div>
</div>

<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>姓名 / 账号</th>
        <th>角色</th>
        <th>部门</th>
        <th>状态</th>
        <th>最后登录</th>
        <th style="text-align:right;">操作</th>
      </tr>
    </thead>
    <tbody id="user-tbody">
      <tr><td colspan="6"><div class="table-empty">加载中…</div></td></tr>
    </tbody>
  </table>
</div>
<div class="pagination" id="user-pagination"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin/users.js"></script>
{% endblock %}
