{% extends "base.html" %}
{% block title %}操作日志 - {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>操作日志</h1>
</div>

<div class="toolbar">
  <div class="form-group">
    <label class="form-label" for="f-user">操作人</label>
    <input class="form-control" type="text" id="f-user" placeholder="账号 / 姓名（服务端搜索）" autocomplete="off">
  </div>
  <div class="form-group">
    <label class="form-label" for="f-action">操作类型</label>
    <select class="form-control" id="f-action"><option value="">全部</option></select>
  </div>
  <div class="form-group">
    <label class="form-label" for="f-object">对象类型</label>
    <select class="form-control" id="f-object">
      <option value="">全部</option>
      <option value="document">资料</option>
      <option value="notice">通知</option>
      <option value="user">用户</option>
      <option value="department">部门</option>
      <option value="category">分类</option>
      <option value="tag">标签</option>
      <option value="backup">备份</option>
      <option value="recycle_bin">回收站</option>
      <option value="notice_type">通知类型</option>
      <option value="audit_log">操作日志</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label" for="f-from">起始日期</label>
    <input class="form-control" type="date" id="f-from">
  </div>
  <div class="form-group">
    <label class="form-label" for="f-to">结束日期</label>
    <input class="form-control" type="date" id="f-to">
  </div>
  <div class="form-group" style="flex:2;min-width:180px;">
    <label class="form-label" for="f-keyword">关键词</label>
    <input class="form-control" type="text" id="f-keyword" placeholder="对象名称 / 说明内容">
  </div>
  <div class="flex gap-2" style="padding-bottom:2px;">
    <button class="btn btn-primary" id="btn-search">查询</button>
    <button class="btn btn-ghost" id="btn-reset">重置</button>
  </div>
</div>

<div class="bulk-bar" id="audit-bulk-bar" hidden>
  <span>已选 <strong id="audit-bulk-num">0</strong> 条</span>
  <button class="btn btn-danger btn-sm" id="btn-audit-batch-delete">删除所选</button>
  <button class="btn btn-ghost btn-sm" id="btn-audit-bulk-cancel">取消</button>
</div>

<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th style="width:36px;"><input type="checkbox" id="audit-check-all" aria-label="全选本页"></th>
        <th>时间</th>
        <th>操作人</th>
        <th>操作</th>
        <th>对象</th>
        <th>详情摘要</th>
        <th>IP</th>
        <th style="text-align:right;">操作</th>
      </tr>
    </thead>
    <tbody id="log-tbody">
      <tr><td colspan="8"><div class="table-empty">加载中…</div></td></tr>
    </tbody>
  </table>
</div>
<div class="pagination" id="log-pagination"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin/audit_logs.js"></script>
{% endblock %}
