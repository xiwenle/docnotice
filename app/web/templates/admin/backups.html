{% extends "base.html" %}
{% block title %}备份恢复 - {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>备份恢复</h1>
  <div class="flex gap-2">
    <select class="form-control" id="backup-type" aria-label="备份类型" style="max-width:140px;">
      <option value="full">完整备份（库+文件）</option>
      <option value="database">仅数据库</option>
    </select>
    <button class="btn btn-primary" id="btn-create-backup">＋ 立即备份</button>
  </div>
</div>

<div id="backup-policy"></div>

<div class="alert alert-warning">
  <span>恢复操作会用备份覆盖当前数据库与文件。<strong>系统会先自动生成当前状态安全备份</strong>。恢复期间请避免并发操作。</span>
</div>

<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>类型</th>
        <th>大小</th>
        <th>文件数</th>
        <th>状态</th>
        <th>创建人 / 时间</th>
        <th style="text-align:right;">操作</th>
      </tr>
    </thead>
    <tbody id="backup-tbody">
      <tr><td colspan="6"><div class="table-empty">加载中…</div></td></tr>
    </tbody>
  </table>
</div>
<div class="pagination" id="backup-pagination"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin/backups.js"></script>
{% endblock %}
